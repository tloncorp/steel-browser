# Build from the steel-browser checkout:
#   docker build -f Dockerfile.browser-relay \
#     -t us-central1-docker.pkg.dev/test-61eb624c/images/browser-relay:latest .
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser-relay
  namespace: tlon
  labels:
    app.kubernetes.io/name: browser-relay
    app.kubernetes.io/component: local-browser
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: browser-relay
      app.kubernetes.io/component: local-browser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: browser-relay
        app.kubernetes.io/component: local-browser
    spec:
      serviceAccountName: pioneer
      automountServiceAccountToken: false
      nodeSelector:
        node.tlon.io/planetary: "true"
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: us-central1-docker.pkg.dev/test-61eb624c/images/browser-relay:latest
          imagePullPolicy: Always
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8081"
            - name: BROWSER_RELAY_PUBLIC_ORIGIN
              value: https://browser-connect.test.tlon.systems
            - name: BROWSER_RELAY_TENANT_HEADER
              value: X-Api-Key
            - name: BROWSER_RELAY_PAIR_TTL_MS
              value: "600000"
            - name: BROWSER_RELAY_CONNECTOR_TTL_MS
              value: "86400000"
            - name: BROWSER_RELAY_REQUEST_TIMEOUT_MS
              value: "600000"
            - name: BROWSER_RELAY_MAX_CONNECTORS
              value: "1000"
          ports:
            - name: relay
              containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: relay
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: relay
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: relay
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: browser-relay
  namespace: tlon
  labels:
    app.kubernetes.io/name: browser-relay
    app.kubernetes.io/component: local-browser
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: browser-relay
    app.kubernetes.io/component: local-browser
  ports:
    - name: relay
      port: 8081
      targetPort: relay
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: browser-relay
  namespace: tlon
  labels:
    app.kubernetes.io/name: browser-relay
    app.kubernetes.io/component: local-browser
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production-dns01
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "960"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "960"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: browser-connect.test.tlon.systems
      http:
        paths:
          - path: /pair
            pathType: Prefix
            backend:
              service:
                name: browser-relay
                port:
                  name: relay
          - path: /connect
            pathType: Prefix
            backend:
              service:
                name: browser-relay
                port:
                  name: relay
          - path: /connector.mjs
            pathType: Exact
            backend:
              service:
                name: browser-relay
                port:
                  name: relay
  tls:
    - hosts:
        - browser-connect.test.tlon.systems
      secretName: tlon-public-wildcard-tls
