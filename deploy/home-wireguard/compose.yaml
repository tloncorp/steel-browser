services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: steel-residential-wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Chicago}
      SERVERURL: ${WIREGUARD_SERVER_URL:-home.scogg.in}
      SERVERPORT: "51820"
      # Keep the existing steelcluster identity for ovh-test-1 so adding the
      # production peers does not rotate the working test-cluster key.
      PEERS: steelcluster,ovh1,ovh2,ovh3,east5
      PEERDNS: 1.1.1.1
      INTERNAL_SUBNET: 10.77.0.0
      ALLOWEDIPS: 0.0.0.0/0
      PERSISTENTKEEPALIVE_PEERS: all
      LOG_CONFS: "false"
    ports:
      - 51820:51820/udp
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv4.ip_forward: "1"
    volumes:
      - ./.data:/config
      - /lib/modules:/lib/modules:ro
