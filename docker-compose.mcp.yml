services:
  steel-mcp:
    build:
      context: ..
      dockerfile: steel-browser/Dockerfile.steel-mcp
    ports:
      - "8000:8000"
    environment:
      BROWSER_VAULT_ENABLED: ${BROWSER_VAULT_ENABLED:-false}
      BROWSER_VAULT_KEY: ${BROWSER_VAULT_KEY:-}
      BROWSER_VAULT_KEY_ID: ${BROWSER_VAULT_KEY_ID:-}
      BROWSER_VAULT_SERVICE_TOKEN: ${BROWSER_VAULT_SERVICE_TOKEN:-}
      BROWSER_VAULT_PIONEER_ORIGIN: ${BROWSER_VAULT_PIONEER_ORIGIN:-}
      STEEL_LOCAL: "true"
      STEEL_BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_started
    networks:
      - steel-network
    restart: unless-stopped
